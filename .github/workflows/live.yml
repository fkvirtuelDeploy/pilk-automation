name: Publish fresh PILK news

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilk-private-archive
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the private PILK source
        uses: actions/checkout@v4
        with:
          repository: lynxerinc/pilk-news
          ref: main
          path: site
          ssh-key: ${{ secrets.PILK_READONLY_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Collect RSS and prepare the live update
        run: node scripts/write-live.js
        working-directory: site
      - name: Open a private checkout for the archive backup
        uses: actions/checkout@v4
        with:
          repository: lynxerinc/pilk-news
          ref: main
          path: backup
          ssh-key: ${{ secrets.PILK_WRITE_DEPLOY_KEY }}
      - name: Commit new articles to the private repository
        run: bash site/scripts/commit-archive.sh site backup
      - name: Publish prepared articles to Cloudflare KV
        run: node scripts/publish-prepared-live.js
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PILK_KV_NAMESPACE_ID: ${{ secrets.PILK_KV_NAMESPACE_ID }}
