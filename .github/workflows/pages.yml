name: Build PILK pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilk-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read the private PILK source
        uses: actions/checkout@v4
        with:
          repository: lynxerinc/pilk-news
          ref: main
          path: site
          ssh-key: ${{ secrets.PILK_READONLY_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Restore private archive from Cloudflare KV
        run: node scripts/archive-kv.js restore
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PILK_KV_NAMESPACE_ID: ${{ secrets.PILK_KV_NAMESPACE_ID }}
      - run: npm run sync
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: https://pilk-3i8.pages.dev
      - run: node scripts/configure-pages.js
        working-directory: site
        env:
          PILK_KV_NAMESPACE_ID: ${{ secrets.PILK_KV_NAMESPACE_ID }}
      - name: Save private archive to Cloudflare KV
        run: node scripts/archive-kv.js save
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PILK_KV_NAMESPACE_ID: ${{ secrets.PILK_KV_NAMESPACE_ID }}
      - name: Deploy Pages
        run: npx wrangler@4 pages deploy dist --project-name=pilk --branch=main --commit-dirty=true
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Open a private checkout for the archive backup
        uses: actions/checkout@v4
        with:
          repository: lynxerinc/pilk-news
          ref: main
          path: backup
          ssh-key: ${{ secrets.PILK_WRITE_DEPLOY_KEY }}
      - name: Commit new articles to the private repository
        shell: bash
        run: |
          cp site/data/archive.json backup/data/archive.json
          cd backup
          git config user.name "PILK Archive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          if git diff --cached --quiet; then
            echo "Private archive is already current."
            exit 0
          fi
          git commit -m "Update PILK article archive"
          git push origin HEAD:main
